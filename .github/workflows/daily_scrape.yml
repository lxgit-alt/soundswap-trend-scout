name: SoundSwap Daily Blog Scout

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 09:00 UTC
  workflow_dispatch:      # Manual trigger

jobs:
  daily-blog-scout:
    runs-on: ubuntu-latest
    env:
      VERCEL_URL: ${{ secrets.VERCEL_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # The following are no longer required for the endpoint call,
      # but kept for debugging if needed.
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    
    steps:
      - name: Debug - Show Environment Status
        run: |
          echo "Checking environment variables..."
          
          # Required for endpoint call
          REQUIRED_VARS=("VERCEL_URL" "CRON_SECRET")
          ALL_SET=true
          
          for var in "${REQUIRED_VARS[@]}"; do
            val="${!var}"
            if [ -z "$val" ]; then
              echo "❌ $var is NOT set"
              ALL_SET=false
            else
              echo "✓ $var is set (length: ${#val} chars)"
            fi
          done
          
          if [ "$ALL_SET" = false ]; then
            echo "🚨 ERROR: Missing required environment variables!"
            echo "Please set VERCEL_URL and CRON_SECRET in GitHub Secrets."
            exit 1
          fi
          
          # Optional variables – only informational
          for var in SERPAPI_KEY DISCORD_BOT_TOKEN DISCORD_CHANNEL_ID GEMINI_API_KEY; do
            if [ -n "${!var}" ]; then
              echo "✓ $var is set"
            else
              echo "⚠ $var is not set (optional for direct endpoint)"
            fi
          done

      - name: Trigger Vercel Scout Endpoint (with fixes applied)
        id: scout
        run: |
          set -x  # Enable command echoing for debugging
          
          echo "🚀 Calling Vercel endpoint with Google News + two‑step AI Overview..."
          
          # Validate required variables
          if [ -z "$VERCEL_URL" ]; then
            echo "❌ ERROR: VERCEL_URL is not set"
            exit 1
          fi
          
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ ERROR: CRON_SECRET is not set"
            exit 1
          fi
          
          # Normalize VERCEL_URL (add https:// if missing)
          URL="$VERCEL_URL"
          if [[ ! "$URL" =~ ^https?:// ]]; then
            URL="https://$URL"
          fi
          
          # Remove trailing slash
          URL="${URL%/}"
          API_URL="${URL}/api/scout-direct"
          
          echo "📡 Endpoint URL constructed"
          echo "URL length: ${#API_URL}"
          
          # Use temp file to preserve output
          RESPONSE_FILE=$(mktemp)
          HTTP_CODE_FILE=$(mktemp)
          
          echo "🔍 Sending POST request..."
          
          # Simpler curl without verbose for now
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 120 \
            -o "$RESPONSE_FILE" \
            -w "%{http_code}" \
            "$API_URL" > "$HTTP_CODE_FILE" 2>&1 || {
              echo "❌ Curl command failed with exit code: $?"
              echo "Response file contents:"
              cat "$RESPONSE_FILE" || echo "(empty)"
              echo "HTTP code file contents:"
              cat "$HTTP_CODE_FILE" || echo "(empty)"
              rm -f "$RESPONSE_FILE" "$HTTP_CODE_FILE"
              exit 1
            }
          
          HTTP_CODE=$(cat "$HTTP_CODE_FILE")
          BODY=$(cat "$RESPONSE_FILE")
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ Curl completed successfully"
          echo "HTTP Status Code: [$HTTP_CODE]"
          echo "Response length: ${#BODY} bytes"
          echo "Response (first 1000 chars):"
          echo "$BODY" | head -c 1000
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          rm -f "$RESPONSE_FILE" "$HTTP_CODE_FILE"
          
          # Validate HTTP_CODE
          if [ -z "$HTTP_CODE" ]; then
            echo "❌ ERROR: HTTP_CODE is empty"
            exit 1
          fi
          
          if ! [[ "$HTTP_CODE" =~ ^[0-9]{3}$ ]]; then
            echo "❌ ERROR: Invalid HTTP code format: [$HTTP_CODE]"
            exit 1
          fi
          
          # Check response
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Scout endpoint executed successfully (HTTP 200)"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Scout endpoint returned HTTP $HTTP_CODE"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Notify Completion
        if: always()
        run: |
          echo "✅ GitHub Actions workflow completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "----------------------------------------"
          echo "🎯 FIXES APPLIED (via Vercel endpoint):"
          echo "• Replaced Google Trends with Google News + Gemini distillation"
          echo "• Fixed AI Overview with two‑step flow (page_token)"
          echo "• Live music industry headlines → 4 search queries"
          echo "----------------------------------------"
          echo "📊 Next steps:"
          echo "1. Check Discord for AI‑enhanced music topics"
          echo "2. Topics now come from live Google News headlines"
          echo "3. AI Overview data is fetched correctly"
          echo "4. Continue rapid Google indexing (<5 hours)"
          echo "----------------------------------------"
          
          if [ "${{ steps.scout.outputs.status }}" = "success" ]; then
            echo "🎉 Daily scout executed successfully with fixes!"
          else
            echo "⚠ Scout execution failed – check Vercel logs for details."
          fi